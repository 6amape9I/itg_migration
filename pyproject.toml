[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "itg-kb-rebuild"
version = "0.1.0"
description = "Stage-based pipeline for rebuilding ITG knowledge base artifacts."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4.12",
  "duckdb>=1.1",
  "lxml>=5.2",
  "markdownify>=0.13",
  "pandas>=2.2",
  "pyarrow>=16.0",
  "pydantic>=2.8",
  "pyyaml>=6.0",
  "rich>=13.7",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "ruff>=0.6",
]

[project.scripts]
itg-kb = "itg_kb.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/itg_kb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
