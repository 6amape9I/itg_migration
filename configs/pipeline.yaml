stages:
  S00:
    name: ingest_csv
    enabled: true
    input: data/00_raw/documents.csv
    outputs:
      - data/01_ingested/documents.parquet
      - data/01_ingested/documents.jsonl
      - data/01_ingested/manifest.jsonl
      - data/90_reports/S00_ingest_report.json
  S01:
    name: normalize_documents
    enabled: true
    input: data/01_ingested/documents.parquet
    outputs:
      - data/02_normalized/documents_normalized.parquet
      - data/02_normalized/blocks.parquet
      - data/90_reports/S01_normalization_report.json
  S02:
    name: primary_tag_candidates
    enabled: false
  S03:
    name: tag_normalization
    enabled: false
  S04:
    name: evidence_extraction
    enabled: false
  S05:
    name: article_compilation
    enabled: false
  S06:
    name: quote_generation
    enabled: false
  S07:
    name: folder_hierarchy
    enabled: false
  S08:
    name: steos_export_package
    enabled: false
  S09:
    name: graph_extraction
    enabled: false
  S10:
    name: qa_reports
    enabled: false

